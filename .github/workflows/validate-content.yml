name: Validate site content

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unresolved merge conflict markers
        run: |
          if git grep -nE '^(<<<<<<<|=======|>>>>>>>)'; then
            echo "Unresolved merge conflict markers found." >&2
            exit 1
          fi
