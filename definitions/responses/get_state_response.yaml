properties:
    ID:
        type: string
        description: "JuiceNet device ID."
    info_timestamp:
        type: number
    show_override:
        type: boolean
    state:
        type: string
        description: "JuiceNet device state (i.e. 'plugged', 'charging', etc.)"
    enum:
        - unknown
        - error
        - disconnect
        - standby
        - plugged
        - charging
    charging:
        properties:
            amps_limit:
                type: number
            amps_current:
                type: number
            voltage:
                type: number
            wh_energy:
                type: number
            savings:
                type: number
            watt_power:
                type: number
            seconds_charging:
                type: number
            wh_energy_at_plugin:
                type: number
            wh_energy_to_add:
                type: number
            flags:
                type: number
            co2:
                $ref: "#/definitions/co2"
    type: object
    lifetime:
        properties:
            wh_energy:
                type: number
            savings:
                type: number
            co2:
                $ref: "#/definitions/co2"
        type: object
    charging_time_left:
        type: number
    plug_unplug_time:
        type: number
    target_time:
        type: number
    override_time:
        type: number
    default_target_time:
        type: number
    time_last_ping:
        type: number
    utc_time:
        type: number
    unit_time:
        type: number
    update_interval:
        type: number
    temperature:
        type: number
    frequency:
        type: number
    message:
        type: string
    triggers_all:
        type: number
    triggers_blocking:
        type: number
    car_id:
        type: number
    success:
        type: boolean
type: object