required:
    - cmd
    - token
    - device_id
properties:
    cmd:
        type: string
        description: "Command code."
        enum: 
            - set_override
    account_token: 
        description: "Account auth token."
        type: string
    token:
        description: "JuiceNet device auth token."
        type: string
    device_id: 
        type: string
        description: "Mobile device ID."
    energy_at_plugin:
        type: number
    override_time:
        type: number
    energy_to_add:
        type: number
type: object