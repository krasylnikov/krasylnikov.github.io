required:
    - cmd
    - device_id
    - ID
    - pin
properties:
    cmd:
        type: string
        description: "Command code."
        enum:
            - pair_device
    device_id: 
        type: string
        description: "Mobile device ID to pair with."
    ID:
        type: string
        description: "JuiceNet device ID to pair with."
    pin:
        type: string
        description: "The password to access JuiceNet device."
type: object